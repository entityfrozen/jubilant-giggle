name: Build Donut SMP Schematic Mega Pack

on:
  push:
    paths:
      - '.github/workflows/build-donut-schematic-megapack.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Assemble schematic mega pack
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE/work"
          PACK="$GITHUB_WORKSPACE/Donut_SMP_Schematic_Mega_Pack"
          mkdir -p "$ROOT" "$PACK"
          mkdir -p \
            "$PACK/01_Farms" \
            "$PACK/02_Bases_Trading_Villagers" \
            "$PACK/03_Redstone_Storage_Utility" \
            "$PACK/04_Nether_End_Heavy_Industry" \
            "$PACK/05_PvP_Traps_Cannons" \
            "$PACK/06_Builder_Shapes" \
            "$PACK/90_Legacy_Schem_Formats" \
            "$PACK/99_Docs_Credits"

          clone_optional() {
            local url="$1"
            local dir="$2"
            git clone --depth 1 "$url" "$dir" || echo "WARN: failed to clone $url"
          }

          copy_schematics() {
            local src="$1"
            local dst="$2"
            [ -d "$src" ] || return 0
            mkdir -p "$dst"
            while IFS= read -r -d '' f; do
              rel="${f#$src/}"
              mkdir -p "$dst/$(dirname "$rel")"
              cp "$f" "$dst/$rel"
            done < <(find "$src" -type f \( -iname '*.litematic' -o -iname '*.schem' -o -iname '*.schematic' -o -iname '*.nbt' \) -print0)
          }

          clone_optional https://github.com/mmodrow/Minecraft-Litmatica-Schematics.git "$ROOT/mmodrow"
          clone_optional https://github.com/CasualMinecraft/casual-builds.git "$ROOT/casual"
          clone_optional https://github.com/OpenBagTwo/Schematics.git "$ROOT/openbagtwo"
          clone_optional https://github.com/zephiowl/litematica-schematics.git "$ROOT/zephiowl"
          clone_optional https://github.com/mor-doc/Breeze360FTL.git "$ROOT/breeze360"
          clone_optional https://github.com/mor-doc/Breeze360FTL_MKII.git "$ROOT/breeze360_mkii"
          clone_optional https://github.com/Greaby/minecraft-circles-schematics.git "$ROOT/circles"

          copy_schematics "$ROOT/mmodrow/Farms" "$PACK/01_Farms/MMODROW_Farm_Library"
          copy_schematics "$ROOT/mmodrow/Builds" "$PACK/02_Bases_Trading_Villagers/MMODROW_Builds"
          copy_schematics "$ROOT/mmodrow/Redstone" "$PACK/03_Redstone_Storage_Utility/MMODROW_Redstone"
          copy_schematics "$ROOT/mmodrow/Tests" "$PACK/04_Nether_End_Heavy_Industry/MMODROW_Tests"

          copy_schematics "$ROOT/casual/farms" "$PACK/01_Farms/CasualMinecraft"
          copy_schematics "$ROOT/casual/bases" "$PACK/02_Bases_Trading_Villagers/CasualMinecraft"
          copy_schematics "$ROOT/casual/redstone" "$PACK/03_Redstone_Storage_Utility/CasualMinecraft"
          copy_schematics "$ROOT/casual/utilities" "$PACK/03_Redstone_Storage_Utility/CasualMinecraft_Utilities"

          copy_schematics "$ROOT/openbagtwo" "$PACK/01_Farms/OpenBagTwo_and_Extras"
          copy_schematics "$ROOT/zephiowl" "$PACK/02_Bases_Trading_Villagers/Zephiowl"
          copy_schematics "$ROOT/breeze360" "$PACK/05_PvP_Traps_Cannons/Breeze360FTL"
          copy_schematics "$ROOT/breeze360_mkii" "$PACK/05_PvP_Traps_Cannons/Breeze360FTL_MKII"
          copy_schematics "$ROOT/circles" "$PACK/06_Builder_Shapes/Circles_1_to_64"

          # Duplicate useful destructive / PvP-adjacent redstone into one easy folder.
          if [ -d "$ROOT/mmodrow" ]; then
            mkdir -p "$PACK/05_PvP_Traps_Cannons/Destructive_Utility"
            while IFS= read -r -d '' f; do
              name="$(basename "$f")"
              cp "$f" "$PACK/05_PvP_Traps_Cannons/Destructive_Utility/$name" || true
            done < <(find "$ROOT/mmodrow" -type f \( -iname '*.litematic' -o -iname '*.schem' -o -iname '*.schematic' \) \
              \( -iname '*tnt*' -o -iname '*bedrock*' -o -iname '*wither*' -o -iname '*tunnel*bore*' -o -iname '*duper*' -o -iname '*cannon*' -o -iname '*trap*' \) -print0)
          fi

          # Pull all legacy .schem/.schematic copies into one compatibility folder too.
          while IFS= read -r -d '' f; do
            rel="${f#$PACK/}"
            safe="$(printf '%s' "$rel" | tr '/' '_')"
            cp "$f" "$PACK/90_Legacy_Schem_Formats/$safe" || true
          done < <(find "$PACK" -type f \( -iname '*.schem' -o -iname '*.schematic' \) -print0)

          cat > "$PACK/00_START_HERE.md" <<'EOF'
          # Donut SMP Schematic Mega Pack

          A survival/SMP-focused schematic library assembled for fast access to farms, bases, villager systems, storage, redstone, Nether/End infrastructure, PvP/destructive utility, and builder shapes.

          ## Install
          Modern Minecraft: copy the folders/files you want into `.minecraft/schematics/` and load them with Litematica.

          `.litematic` = Litematica format. `.schem`/`.schematic` files are duplicated into `90_Legacy_Schem_Formats` for tools that support those formats.

          ## Best folders for Donut-style progression
          - `01_Farms` — kelp, bonemeal/moss, crop, bamboo/sugar cane, iron, gold, raid, creeper, slime, wool, honey, wood, shulker, guardian, wither skeleton, villager breeder, and more.
          - `02_Bases_Trading_Villagers` — trading halls, survival/base builds, breeder-adjacent builds.
          - `03_Redstone_Storage_Utility` — autosmelters, sorters, shulker loaders/unloaders, autocrafting/storage, transport, TNT utility.
          - `04_Nether_End_Heavy_Industry` — test rigs and heavy industrial builds.
          - `05_PvP_Traps_Cannons` — pearl cannons plus TNT/bedrock/wither/tunnel-bore/destructive templates gathered into one place.

          ## Important
          Test technical farms in a creative copy first. Server software, anti-cheat, entity limits, redstone changes, and Minecraft version changes can break older designs.
          EOF

          cat > "$PACK/99_Docs_Credits/SOURCES_AND_CREDITS.md" <<'EOF'
          # Sources and credits

          This is a personal-use compilation. Keep creator attribution and do not re-upload other creators' work as your own.

          - MMODROW Minecraft-Litmatica-Schematics — https://github.com/mmodrow/Minecraft-Litmatica-Schematics — large personal schematic archive; source repo does not declare a GitHub license, so treat these files as personal-use/source-attributed material and check creator notes before redistribution.
          - CasualMinecraft/casual-builds — https://github.com/CasualMinecraft/casual-builds — repository explicitly permits redistribution with credit; individual build credits remain with their creators.
          - OpenBagTwo/Schematics — https://github.com/OpenBagTwo/Schematics — AGPL-3.0 repository; preserve attribution/share-alike requirements where applicable.
          - zephiowl/litematica-schematics — https://github.com/zephiowl/litematica-schematics — MIT-licensed repository.
          - mor-doc/Breeze360FTL — https://github.com/mor-doc/Breeze360FTL — CC0/public-domain project.
          - mor-doc/Breeze360FTL_MKII — https://github.com/mor-doc/Breeze360FTL_MKII — CC0/public-domain project.
          - Greaby/minecraft-circles-schematics — https://github.com/Greaby/minecraft-circles-schematics — CC0/public-domain project.

          Donut-specific public libraries worth browsing for newer server-meta builds and traps:
          - https://www.donutsmp-schematics.com/
          - https://www.donutsmp-schematics.com/?subcat=Kelp%20Farms
          - https://www.donutsmp-schematics.com/?subcat=Traps
          - https://www.donutsmp-schematics.com/?subcat=Bone%20Bases
          - https://www.donutsmp-schematics.com/?subcat=Autosorters%20%26%20Shulker%20Loaders

          DonutSMP Schematics' own terms state creators retain copyright and grant that platform a license to host/display/distribute their uploads. Those site-hosted files are therefore linked here rather than mass re-hosted in this ZIP.
          EOF

          cat > "$PACK/99_Docs_Credits/COMPATIBILITY.md" <<'EOF'
          # Compatibility

          Most of this pack is `.litematic`, intended for Litematica on modern Java Minecraft.

          If by "Schematica" you mean the old Schematica mod, it does not natively use every modern `.litematic` file. Use Litematica on modern versions, or convert individual files to `.schem`/`.schematic` with a compatible converter. Any source-provided legacy formats are copied into `90_Legacy_Schem_Formats`.

          For farms, always verify the Minecraft version and server mechanics before investing materials. Technical designs that depend on update order, TNT duplication, mob spawning, portal linking, villager AI, or minecart behavior are especially version/server-sensitive.
          EOF

          {
            echo "Donut SMP Schematic Mega Pack manifest"
            echo "Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "Counts by extension:"
            find "$PACK" -type f | awk -F. 'NF>1 {ext=tolower($NF); c[ext]++} END {for (e in c) print e, c[e]}' | sort
            echo
            echo "All schematic files:"
            find "$PACK" -type f \( -iname '*.litematic' -o -iname '*.schem' -o -iname '*.schematic' -o -iname '*.nbt' \) | sed "s#^$PACK/##" | sort
          } > "$PACK/99_Docs_Credits/MANIFEST.txt"

          TOTAL=$(find "$PACK" -type f \( -iname '*.litematic' -o -iname '*.schem' -o -iname '*.schematic' -o -iname '*.nbt' \) | wc -l)
          echo "Total schematic-format files: $TOTAL"
          test "$TOTAL" -ge 25

          cd "$GITHUB_WORKSPACE"
          zip -r -9 Donut_SMP_Schematic_Mega_Pack.zip Donut_SMP_Schematic_Mega_Pack

      - name: Upload schematic pack
        uses: actions/upload-artifact@v4
        with:
          name: Donut_SMP_Schematic_Mega_Pack
          path: Donut_SMP_Schematic_Mega_Pack.zip
          compression-level: 0
          retention-days: 7
